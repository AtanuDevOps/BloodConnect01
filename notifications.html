<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications · BloodConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body class="notifications-page">
  <header class="navbar">
    <div class="brand">
      <i class="fa-solid fa-droplet"></i>
      <span>BloodConnect</span>
    </div>
    <div class="nav-right">
      <div id="navProfile" class="avatar-circle" style="width: 32px; height: 32px; font-size: 14px; cursor: pointer;">U</div>
    </div>
  </header>

  <main class="container" style="padding-bottom: 100px;">
    <h2 style="margin: 10px 0 20px; color: var(--primary);">Notifications</h2>

    <!-- Profile Access Requests Section -->
    <section class="card" id="accessRequestsSection" style="display:none; margin-bottom: 24px;">
      <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-user-shield"></i> Profile Access Requests</h3>
      <div id="requestsList" style="display: grid; gap: 12px;">
        <!-- Requests will be injected here -->
      </div>
    </section>

    <!-- Responses Given (As Donor) -->
    <section class="card" id="myResponsesSection" style="display:none; margin-top:16px;">
      <h3 style="margin-bottom:12px;">Requests I Responded To</h3>
      <div id="myResponsesList" style="display:grid; gap:10px;"></div>
    </section>

    <div id="noNotifications" class="muted" style="text-align: center; margin-top: 40px; display: none;">
      <i class="fa-solid fa-bell-slash" style="font-size: 48px; margin-bottom: 16px; opacity: 0.3;"></i>
      <p>No new notifications</p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./dashboard.js"></script>
  
  <script>
    (function(){
      const db = firebase.firestore();
      const auth = firebase.auth();
      
      auth.onAuthStateChanged(user => {
        if(!user) {
          window.location.href = "index.html";
          return;
        }
        loadMyResponses(user.uid);
        
        // Listen for profile changes to show access requests
        db.collection("users").doc(user.uid).onSnapshot(doc => {
          if(doc.exists) {
            const data = doc.data();
            renderAccessRequests(data.accessRequests || []);
            checkEmptyState();
          }
        });
      });

      async function loadMyResponses(uid) {
        try {
          const snap = await db.collection("bloodRequests").orderBy("createdAt", "desc").limit(50).get();
          const myResponses = [];
          snap.forEach(doc => {
            const data = doc.data();
            if(data.responses && data.responses.some(r => r.donorId === uid)) {
              myResponses.push(data);
            }
          });

          const section = document.getElementById("myResponsesSection");
          const list = document.getElementById("myResponsesList");

          if(myResponses.length > 0) {
            section.style.display = "block";
            list.innerHTML = myResponses.map(d => {
              return `
                <div style="padding:12px; background:var(--bg); border-radius:12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border);">
                  <div>
                    <div style="font-weight:600; font-size:14px;">Helping: ${d.patientName}</div>
                    <div style="font-size:12px; color:var(--muted)">${d.hospitalName}</div>
                  </div>
                  <div style="font-size:12px; color:green; font-weight: 600;">
                    <i class="fa-solid fa-check"></i> Responded
                  </div>
                </div>
              `;
            }).join("");
          } else {
            section.style.display = "none";
          }
          checkEmptyState();
        } catch(e) { console.error("Error loading responses", e); }
      }

      function renderAccessRequests(requests) {
        const section = document.getElementById("accessRequestsSection");
        const list = document.getElementById("requestsList");
        const pending = requests.filter(r => r.status === "pending");

        if (pending.length === 0) {
          section.style.display = "none";
          return;
        }

        section.style.display = "block";
        list.innerHTML = pending.map(req => {
          return `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
              <div>
                <strong>${req.requesterName}</strong>
                <div class="muted" style="font-size:12px">Requested access to contact info</div>
              </div>
              <div style="display:flex; gap:8px;">
                <button onclick="handleRequest('${req.requesterId}', 'approved')" class="action-btn" style="padding:6px 12px; font-size:12px; border-radius: 8px;">Approve</button>
                <button onclick="handleRequest('${req.requesterId}', 'ignored')" class="action-btn secondary" style="padding:6px 12px; font-size:12px; border-radius: 8px;">Ignore</button>
              </div>
            </div>
          `;
        }).join("");
      }

      function checkEmptyState() {
        setTimeout(() => {
          const respVisible = document.getElementById("myResponsesSection").style.display !== "none";
          const accessVisible = document.getElementById("accessRequestsSection").style.display !== "none";
          document.getElementById("noNotifications").style.display = (!respVisible && !accessVisible) ? "block" : "none";
        }, 500);
      }

      window.handleRequest = async function(requesterId, action) {
        const user = auth.currentUser;
        if(!user) return;
        try {
          const doc = await db.collection("users").doc(user.uid).get();
          const requests = doc.data().accessRequests || [];
          const updated = requests.map(r => r.requesterId === requesterId ? { ...r, status: action } : r);
          await db.collection("users").doc(user.uid).update({ accessRequests: updated });
          alert("Request " + action);
        } catch(e) { console.error(e); }
      };

      const navProfile = document.getElementById("navProfile");
      if(navProfile) {
        navProfile.addEventListener("click", () => window.location.href = "donor-dashboard.html");
      }
    })();
  </script>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="blood-requests.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
    </a>
    <a href="find-donors.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>
    <a href="foundation.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-message"></i>
    </a>
    <a href="notifications.html" class="nav-item active">
      <i class="fa-solid fa-bell"></i>
    </a>
    <a href="donor-dashboard.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
    </a>
  </nav>
</body>
</html>
