<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications · BloodConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body class="notifications-page">
  <header class="navbar">
    <div class="brand">
      <i class="fa-solid fa-droplet"></i>
      <span>BloodConnect</span>
    </div>
    <div class="nav-right">
      <div id="navProfile" class="avatar-circle" style="width: 32px; height: 32px; font-size: 14px; cursor: pointer;">U</div>
    </div>
  </header>

  <main class="container">
    <h2 style="margin: 10px 0 20px; color: var(--primary);">Notifications</h2>

    <!-- Profile Access Requests Section -->
    <section class="card" id="accessRequestsSection" style="display:none; margin-bottom: 24px;">
      <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-user-shield"></i> Profile Access Requests</h3>
      <div id="requestsList" style="display: grid; gap: 12px;">
        <!-- Requests will be injected here -->
      </div>
    </section>

    <!-- Foundation Join Requests Section -->
    <section class="card" id="foundationJoinRequestsSection" style="display:none; margin-bottom: 24px;">
      <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-users-line"></i> Foundation Join Requests</h3>
      <div id="foundationJoinRequestsList" style="display: grid; gap: 12px;"></div>
    </section>

    <!-- Foundation Comment Notifications -->
    <section class="card" id="foundationCommentsSection" style="display:none; margin-bottom: 24px;">
      <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-comments"></i> Foundation Comments</h3>
      <div id="foundationCommentsList" style="display: grid; gap: 12px;"></div>
    </section>
    
    <!-- Responses Given (As Donor) -->
    <section class="card" id="myResponsesSection" style="display:none; margin-top:16px;">
      <h3 style="margin-bottom:12px;">Requests I Responded To</h3>
      <div id="myResponsesList" style="display:grid; gap:10px;"></div>
    </section>

    <div id="noNotifications" class="muted" style="text-align: center; margin-top: 40px; display: none;">
      <i class="fa-solid fa-bell-slash" style="font-size: 48px; margin-bottom: 16px; opacity: 0.3;"></i>
      <p>No new notifications</p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./dashboard.js"></script>
  
  <script>
    (function(){
      const db = firebase.firestore();
      const auth = firebase.auth();
      
      auth.onAuthStateChanged(user => {
        if(!user) {
          window.location.href = "index.html";
          return;
        }
        loadMyResponses(user.uid);
        loadFoundationComments(user.uid);
        loadFoundationJoinRequests(user.uid);
        
        // Listen for profile changes to show access requests
        db.collection("users").doc(user.uid).onSnapshot(doc => {
          if(doc.exists) {
            const data = doc.data();
            renderAccessRequests(data.accessRequests || []);
            checkEmptyState();
          }
        });
        
        // Listen for unread notifications
        db.collection("notifications")
          .where("recipientId", "==", user.uid)
          .where("isRead", "==", false)
          .onSnapshot(function(snap){
            var badge = document.getElementById("unreadCount");
            if(badge){
              if(snap.size > 0){
                badge.textContent = snap.size > 9 ? "9+" : snap.size;
                badge.style.display = "flex";
              } else {
                badge.style.display = "none";
              }
            }
          });
      });

      async function loadMyResponses(uid) {
        try {
          const snap = await db.collection("bloodRequests").orderBy("createdAt", "desc").limit(50).get();
          const myResponses = [];
          snap.forEach(doc => {
            const data = doc.data();
            if(data.responses && data.responses.some(r => r.donorId === uid)) {
              myResponses.push(data);
            }
          });

          const section = document.getElementById("myResponsesSection");
          const list = document.getElementById("myResponsesList");

          if(myResponses.length > 0) {
            section.style.display = "block";
            list.innerHTML = myResponses.map(d => {
              return `
                <div style="padding:12px; background:var(--bg); border-radius:12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border);">
                  <div>
                    <div style="font-weight:600; font-size:14px;">Helping: ${d.patientName}</div>
                    <div style="font-size:12px; color:var(--muted)">${d.hospitalName}</div>
                  </div>
                  <div style="font-size:12px; color:green; font-weight: 600;">
                    <i class="fa-solid fa-check"></i> Responded
                  </div>
                </div>
              `;
            }).join("");
          } else {
            section.style.display = "none";
          }
          checkEmptyState();
        } catch(e) { console.error("Error loading responses", e); }
      }

      function renderAccessRequests(requests) {
        const section = document.getElementById("accessRequestsSection");
        const list = document.getElementById("requestsList");
        const pending = requests.filter(r => r.status === "pending");

        if (pending.length === 0) {
          section.style.display = "none";
          return;
        }

        section.style.display = "block";
        list.innerHTML = pending.map(req => {
          return `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
              <div>
                <strong>${req.requesterName}</strong>
                <div class="muted" style="font-size:12px">Requested access to contact info</div>
              </div>
              <div style="display:flex; gap:8px;">
                <button onclick="handleRequest('${req.requesterId}', 'approved')" class="action-btn" style="padding:6px 12px; font-size:12px; border-radius: 8px;">Approve</button>
                <button onclick="handleRequest('${req.requesterId}', 'ignored')" class="action-btn secondary" style="padding:6px 12px; font-size:12px; border-radius: 8px;">Ignore</button>
              </div>
            </div>
          `;
        }).join("");
      }

      function checkEmptyState() {
        setTimeout(() => {
          const respVisible = document.getElementById("myResponsesSection").style.display !== "none";
          const accessVisible = document.getElementById("accessRequestsSection").style.display !== "none";
          const commentsVisible = document.getElementById("foundationCommentsSection").style.display !== "none";
          const joinRequestsVisible = document.getElementById("foundationJoinRequestsSection").style.display !== "none";
          document.getElementById("noNotifications").style.display = (!respVisible && !accessVisible && !commentsVisible && !joinRequestsVisible) ? "block" : "none";
        }, 500);
      }

      function loadFoundationComments(uid) {
        db.collection("notifications")
          .where("recipientId", "==", uid)
          .where("notificationType", "==", "foundation_comment")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            const section = document.getElementById("foundationCommentsSection");
            const list = document.getElementById("foundationCommentsList");
            
            if(snap.empty) {
              section.style.display = "none";
              checkEmptyState();
              return;
            }
            
            section.style.display = "block";
            list.innerHTML = snap.docs.map(doc => {
              const n = doc.data();
              return `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:${n.isRead ? '#fff' : '#fff0f2'}; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor:pointer;" onclick="openCommentNotification('${doc.id}', '${n.foundationId}', '${n.postId}')">
                  <div>
                    <div style="font-weight:600; font-size:14px;">${escapeHtml(n.commenterName)} commented on a ${escapeHtml(n.foundationName)} campaign post</div>
                    <div style="font-size:12px; color:var(--muted); margin-top:4px;">${escapeHtml(n.commentText)}</div>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    ${!n.isRead ? '<div style="width:8px; height:8px; background:#CE1126; border-radius:50%;"></div>' : ''}
                    <i class="fa-solid fa-chevron-right" style="color:var(--muted);"></i>
                  </div>
                </div>
              `;
            }).join("");
            checkEmptyState();
          });
      }
      
      window.openCommentNotification = async function(notificationId, foundationId, postId) {
        try {
          await db.collection("notifications").doc(notificationId).update({ isRead: true });
          window.location.href = "foundation-campaigns.html?foundationId=" + encodeURIComponent(foundationId) + "#post-" + postId;
        } catch(e) {
          console.error(e);
          window.location.href = "foundation-campaigns.html?foundationId=" + encodeURIComponent(foundationId);
        }
      };

      function loadFoundationJoinRequests(uid) {
        db.collection("notifications")
          .where("recipientId", "==", uid)
          .where("notificationType", "==", "foundation_join_request")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            const section = document.getElementById("foundationJoinRequestsSection");
            const list = document.getElementById("foundationJoinRequestsList");
            
            if(snap.empty) {
              section.style.display = "none";
              checkEmptyState();
              return;
            }
            
            section.style.display = "block";
            list.innerHTML = snap.docs.map(doc => {
              const n = doc.data();
              return `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:${n.isRead ? '#fff' : '#fff0f2'}; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor:pointer;" onclick="openJoinRequestNotification('${doc.id}', '${n.foundationId}')">
                  <div>
                    <div style="font-weight:600; font-size:14px;">${escapeHtml(n.userName)} requested to join ${escapeHtml(n.foundationName)}</div>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    ${!n.isRead ? '<div style="width:8px; height:8px; background:#CE1126; border-radius:50%;"></div>' : ''}
                    <i class="fa-solid fa-chevron-right" style="color:var(--muted);"></i>
                  </div>
                </div>
              `;
            }).join("");
            checkEmptyState();
          });
      }
      
      window.openJoinRequestNotification = async function(notificationId, foundationId) {
        try {
          await db.collection("notifications").doc(notificationId).update({ isRead: true });
          window.location.href = "foundation-dashboard.html?foundationId=" + encodeURIComponent(foundationId);
        } catch(e) {
          console.error(e);
          window.location.href = "foundation-dashboard.html?foundationId=" + encodeURIComponent(foundationId);
        }
      };
      
      function escapeHtml(text) {
        if (!text) return "";
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      
      window.handleRequest = async function(requesterId, action) {
        const user = auth.currentUser;
        if(!user) return;
        try {
          const doc = await db.collection("users").doc(user.uid).get();
          const requests = doc.data().accessRequests || [];
          const updated = requests.map(r => r.requesterId === requesterId ? { ...r, status: action } : r);
          await db.collection("users").doc(user.uid).update({ accessRequests: updated });
          alert("Request " + action);
        } catch(e) { console.error(e); }
      };

      const navProfile = document.getElementById("navProfile");
      if(navProfile) {
        navProfile.addEventListener("click", () => window.location.href = "donor-dashboard.html");
      }
    })();
  </script>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="blood-requests.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
    </a>
    <a href="find-donors.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>
    <a href="foundation.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-message"></i>
    </a>
    <a href="notifications.html" class="nav-item active" style="position:relative;">
      <i class="fa-solid fa-bell"></i>
      <span id="unreadCount" class="unread-badge" style="display:none; position:absolute; top:2px; right:2px; background:#CE1126; color:#fff; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;"></span>
    </a>
    <a href="donor-dashboard.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
    </a>
  </nav>
</body>
</html>
