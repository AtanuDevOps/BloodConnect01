<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BloodConnect · Auth</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./signup.css">
</head>
<body class="auth-page">
  <div class="auth-header">
    <h1 class="app-title">BloodConnect</h1>
  </div>

  <div class="auth-card">
    <div class="toggle-container">
      <div id="toggleSelector" class="toggle-selector"></div>
      <button id="loginToggle" class="toggle-btn active">LOGIN</button>
      <button id="signupToggle" class="toggle-btn">SIGN UP</button>
    </div>

    <div id="formTitleSection" class="form-header">
      <h2 id="formTitle">LOGIN</h2>
      <p id="formSubtitle">LOG IN WITH YOUR DETAILS</p>
    </div>

    <form id="authForm" autocomplete="on" novalidate>
      <!-- Signup Only Fields -->
      <div id="nameField" class="input-group" style="display: none;">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Enter your name">
      </div>

      <!-- Common Fields -->
      <div class="input-group">
        <label id="identifierLabel" for="identifier">Phone Number / Email</label>
        <input id="identifier" name="identifier" type="text" placeholder="Enter phone or email" required>
      </div>

      <!-- Signup Only Fields -->
      <div id="signupSpecificFields" style="display: none;">
        <div class="input-group">
          <label for="bloodGroup">Blood group</label>
          <select id="bloodGroup" name="bloodGroup">
            <option value="">Select blood group</option>
            <option>O+</option><option>O-</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
          </select>
        </div>
        <div class="input-group">
          <label for="location">Location</label>
          <input id="location" name="location" type="text" placeholder="Enter your location">
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Minimum 6 characters" minlength="6" required>
      </div>

      <div class="error" id="error"></div>
      
      <button id="submitBtn" class="submit-btn" type="submit">LOGIN</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
