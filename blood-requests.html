<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blood Requests · BloodConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body class="home-page">
  <div class="container" style="padding-top: 40px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h1 style="color: var(--primary); font-weight: 700; margin: 0; font-size: 32px;">BloodConnect</h1>
    </div>

    <div style="display: flex; gap: 12px; margin-bottom: 30px; align-items: stretch;">
      <button id="makeRequestBtn" class="action-btn" style="flex: 1; border-radius: 12px; padding: 16px; font-size: 18px; justify-content: flex-start; box-shadow: 0 4px 15px rgba(206,17,38,0.3);">
        <i class="fa-solid fa-plus"></i>
        <span>Make blood request</span>
      </button>
      <button onclick="window.location.href='find-donors.html'" class="action-btn secondary" style="width: 54px; border-radius: 12px; border-color: var(--border); padding: 0; display: flex; align-items: center; justify-content: center; background: #fff;">
        <i class="fa-solid fa-magnifying-glass" style="color: #333; font-size: 20px;"></i>
      </button>
    </div>

    <!-- Requests Feed -->
    <div id="requestsFeed">
      <div class="no-results">Loading requests...</div>
    </div>
  </div>

  <!-- Make Request Modal -->
  <div id="requestModal" class="modal">
    <div class="modal-content card">
      <h2 style="margin-bottom:16px">Make a Blood Request</h2>
      <form id="requestForm" style="display:grid; gap:12px;">
        <div>
          <label class="label-sm">Patient Name</label>
          <input type="text" id="reqPatientName" class="input-field" required>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div>
            <label class="label-sm">Age</label>
            <input type="number" id="reqPatientAge" class="input-field" required>
          </div>
          <div>
            <label class="label-sm">Blood Group</label>
            <select id="reqBloodGroup" class="input-field" required>
              <option value="">Select</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
        </div>
        <div>
          <label class="label-sm">Hospital Name</label>
          <input type="text" id="reqHospital" class="input-field" required>
        </div>
        <div>
          <label class="label-sm">Description / Note</label>
          <textarea id="reqDescription" class="input-field" rows="3" placeholder="Urgency, contact details (optional), etc." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="closeRequestModal" class="action-btn secondary">Cancel</button>
          <button type="submit" class="action-btn">Post Request</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Respond Modal (Donor Only) -->
  <div id="responseModal" class="modal">
    <div class="modal-content card">
      <h2 style="margin-bottom:16px">Respond to Request</h2>
      <p class="muted" style="font-size:14px; margin-bottom:12px;">Let them know you can help.</p>
      <form id="responseForm" style="display:grid; gap:12px;">
        <input type="hidden" id="respRequestId">
        <div>
          <label class="label-sm">Message</label>
          <textarea id="respMessage" class="input-field" rows="3" placeholder="I am available to donate..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="closeResponseModal" class="action-btn secondary">Cancel</button>
          <button type="submit" class="action-btn">Send Response</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./js/blood-requests.js"></script>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="blood-requests.html" class="nav-item active">
      <i class="fa-solid fa-house"></i>
    </a>
    <a href="find-donors.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>
    <a href="foundation.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-message"></i>
    </a>
    <a href="notifications.html" class="nav-item">
      <i class="fa-solid fa-bell"></i>
    </a>
    <a href="donor-dashboard.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
    </a>
  </nav>
</body>
</html>
