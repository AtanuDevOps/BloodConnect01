<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foundation Campaigns · BloodConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./dashboard.css">
  <style>
    .feed-card { padding:12px; border:1px solid var(--border); border-radius:12px; background:#fff; margin-bottom:12px; }
    .feed-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .type-badge { font-size:12px; background:#fff0f2; color:#CE1126; padding:2px 8px; border-radius:12px; border:1px solid #ffd4da; }
    .feed-image { width:100%; border-radius:8px; margin:8px 0; }
    .reaction-bar { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .reaction-btn { border:none; background:#f8f8f8; padding:6px 10px; border-radius:999px; cursor:pointer; font-size:12px; }
    .reaction-btn:hover { background:#eee; }
    .hidden { display:none; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
    .modal-content { width:90%; max-width:520px; background:#fff; border-radius:12px; padding:16px; }
    .label-sm { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
    .input-field, .select-field, .textarea-field { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; }
    .preview { width:100%; margin-top:8px; border-radius:8px; }
    .campaign-image { width: 100%; border-radius: 12px; margin-top: 10px; }
    
    /* Comment Modal Styles */
    .comment-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      animation: fadeIn 0.2s ease-out;
    }
    .comment-modal.active { display: flex; align-items: flex-end; justify-content: center; }
    .comment-modal-content {
      width: 100%;
      max-height: 85vh;
      background: #fff;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }
    @media (min-width: 768px) {
      .comment-modal.active { align-items: center; }
      .comment-modal-content {
        max-width: 560px;
        max-height: 80vh;
        border-radius: 16px;
      }
    }
    .comment-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .comment-modal-title { font-weight: 600; font-size: 16px; }
    .comment-modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
    }
    .comment-modal-preview { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .comment-modal-preview .preview-header { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .comment-modal-preview .preview-caption { font-size: 14px; color: #333; }
    .comment-modal-preview .preview-image { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .comment-item {
      display: flex;
      gap: 10px;
      font-size: 14px;
    }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #CE1126, #ff6b6b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .comment-content { flex: 1; }
    .comment-author { font-weight: 600; margin-bottom: 2px; }
    .comment-text { color: #444; }
    .comment-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .comment-input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .comment-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      outline: none;
    }
    .comment-input:focus { border-color: #CE1126; }
    .comment-send-btn {
      background: #CE1126;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }
    .comment-send-btn:hover { background: #a80f20; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./cloudinary-config.js"></script>
  <script>
    (function(){
      function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m && decodeURIComponent(m[1].replace(/\+/g, ' '));
      }
      function escapeHtml(text){ if(!text) return ""; return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function tsToDate(ts) {
        if (!ts) return null;
        if (typeof ts.toMillis === "function") return new Date(ts.toMillis());
        if (typeof ts.seconds === "number") return new Date(ts.seconds * 1000);
        return null;
      }
      var fid = getParam('foundationId');
      var app = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(window.firebaseConfig);
      var auth = firebase.auth(app);
      var db = firebase.firestore(app);
      var storage = firebase.storage();
      var foundationName = "Foundation";
      var canPost = false;
      var currentUser = null;
      var foundationData = null;
      auth.onAuthStateChanged(async function(user){
        if(!user){ window.location.href = "index.html"; return; }
        currentUser = user;
        if(!fid){ document.getElementById("pageTitle").textContent = "Invalid Foundation"; return; }
        try {
          var fdDoc = await db.collection("foundation_requests").doc(fid).get();
          if(fdDoc.exists){
            var d = fdDoc.data();
            foundationData = d;
            foundationName = d.name || "Foundation";
            document.getElementById("pageTitle").textContent = "Foundation Campaigns";
            var admins = Array.isArray(d.admins) ? d.admins : [];
            canPost = (d.ownerId === user.uid) || admins.indexOf(user.uid) !== -1;
            var btn = document.getElementById("startCampaignBtn");
            if (btn) btn.style.display = canPost ? "inline-flex" : "none";
          }
        } catch(e){}
        initFeed();
        // Listen for unread notifications
        db.collection("notifications")
          .where("recipientId", "==", user.uid)
          .where("isRead", "==", false)
          .onSnapshot(function(snap){
            var badge = document.getElementById("unreadCount");
            if(badge){
              if(snap.size > 0){
                badge.textContent = snap.size > 9 ? "9+" : snap.size;
                badge.style.display = "flex";
              } else {
                badge.style.display = "none";
              }
            }
          });
      });
      window.addEventListener("DOMContentLoaded", function(){
        document.getElementById("backBtn").addEventListener("click", function(){
          window.location.href = "foundation-dashboard.html?foundationId=" + encodeURIComponent(fid||"");
        });
        var startBtn = document.getElementById("startCampaignBtn");
        var modal = document.getElementById("campaignModal");
        var closeModalBtn = document.getElementById("closeCampaignModal");
        var imgFileEl = document.getElementById("campaignImage");
        var previewImg = document.getElementById("previewImg");
        var commentModal = document.getElementById("commentModal");
        if(startBtn){
          startBtn.addEventListener("click", function(){ if(canPost) modal.style.display = "flex"; });
        }
        if(closeModalBtn){
          closeModalBtn.addEventListener("click", function(){ modal.style.display = "none"; });
        }
        window.onclick = function(e) {
          if (e.target === modal) modal.style.display = "none";
          if (e.target === commentModal) closeCommentModal();
        };
        imgFileEl.addEventListener("change", function(){
          var f = imgFileEl.files && imgFileEl.files[0];
          if(f && f.type && f.type.startsWith("image/")){
            var reader = new FileReader();
            reader.onload = function(evt){ previewImg.src = evt.target.result; previewImg.classList.remove("hidden"); };
            reader.readAsDataURL(f);
          } else {
            previewImg.src = "";
            previewImg.classList.add("hidden");
          }
        });
        document.getElementById("campaignForm").addEventListener("submit", postCampaign);
      });
      var currentPostData = null;
      var currentPostId = null;
      var commentsUnsubscribe = null;
      
      function initFeed(){
        var feed = document.getElementById("campaignFeed");
        db.collection("foundation_campaign_posts")
          .where("foundationId","==",fid)
          .orderBy("createdAt","desc")
          .onSnapshot(function(snap){
            if(snap.empty){ feed.innerHTML = '<div class="no-results">No campaigns yet.</div>'; return; }
            var html = [];
            snap.forEach(function(doc){
              var p = doc.data();
              var dt = tsToDate(p.createdAt);
              var dateStr = dt ? dt.toLocaleString() : "Just now";
              var canDelete = (currentUser && (foundationData && (foundationData.ownerId === currentUser.uid) || (foundationData && foundationData.admins && foundationData.admins.includes(currentUser.uid))));
              html.push(
                '<div class="feed-card" id="post-'+ doc.id +'">'
                + '<div class="feed-header">'
                +   '<div><strong style="cursor:pointer;" onclick="window.location.href=\'foundation-public-profile.html?foundationId='+fid+'\'">'+ escapeHtml(p.foundationName||foundationName) +'</strong> <span class="type-badge">'+ escapeHtml(p.campaignType||"Campaign") +'</span></div>'
                +   '<div class="muted-sm">'+ dateStr +'</div>'
                +   (canDelete ? `<button class="campaign-delete-btn" onclick="deleteCampaign('${doc.id}')" style="background:none; border:none; cursor:pointer; color:#888;"><i class="fa-solid fa-trash"></i></button>` : '')
                + '</div>'
                + (p.imageURL ? '<img class="campaign-image" src="'+ escapeHtml(p.imageURL) +'" alt="campaign">' : '')
                + '<div>'+ escapeHtml(p.caption||"") +'</div>'
                + '<div class="reaction-bar">'
                +   '<button class="reaction-btn" onclick="reactPost(\''+ doc.id +'\', \'like\')">👍 '+ (p.likeCount||0) +'</button>'
                +   '<button class="reaction-btn" onclick="reactPost(\''+ doc.id +'\', \'love\')">❤️ '+ (p.loveCount||0) +'</button>'
                +   '<button class="reaction-btn" onclick="reactPost(\''+ doc.id +'\', \'wow\')">😮 '+ (p.wowCount||0) +'</button>'
                +   '<button class="reaction-btn" onclick="reactPost(\''+ doc.id +'\', \'angry\')">😡 '+ (p.angryCount||0) +'</button>'
                +   '<button class="reaction-btn" onclick="openCommentModal(\''+ doc.id +'\')">💬 '+ (p.commentCount||0) +'</button>'
                + '</div>'
                + '</div>'
              );
            });
            feed.innerHTML = html.join("");
          }, function(err){
            feed.innerHTML = '<div class="no-results">Failed to load campaigns.</div>';
          });
      }
      
      window.deleteCampaign = async function(campaignId) {
        if(!confirm('Delete this campaign?')) return;
        if(!currentUser) return;
        // Check permission
        const fdDoc = await db.collection("foundation_requests").doc(fid).get();
        if(!fdDoc.exists) return;
        const fdData = fdDoc.data();
        const isOwner = fdData.ownerId === currentUser.uid;
        const isAdmin = fdData.admins && fdData.admins.includes(currentUser.uid);
        if(!isOwner && !isAdmin) {
          alert('Only foundation owner and admins can delete campaigns.');
          return;
        }
        
        try {
          await db.collection('foundation_campaign_posts').doc(campaignId).delete();
          alert('Campaign deleted successfully!');
        } catch(e) {
          console.error('Failed to delete campaign:', e);
          alert('Failed to delete campaign.');
        }
      };
      
      window.openCommentModal = async function(postId) {
        currentPostId = postId;
        try {
          var postDoc = await db.collection("foundation_campaign_posts").doc(postId).get();
          if(!postDoc.exists) return;
          currentPostData = postDoc.data();
          var modal = document.getElementById("commentModal");
          var previewName = document.getElementById("commentModalPreviewName");
          var previewCaption = document.getElementById("commentModalPreviewCaption");
          var previewImage = document.getElementById("commentModalPreviewImage");
          previewName.textContent = currentPostData.foundationName || foundationName;
          previewCaption.textContent = currentPostData.caption || "";
          if(currentPostData.imageURL) {
            previewImage.src = currentPostData.imageURL;
            previewImage.classList.remove("hidden");
          } else {
            previewImage.classList.add("hidden");
          }
          modal.classList.add("active");
          loadCommentsForModal(postId);
        } catch(e) {
          console.error(e);
        }
      };
      
      window.closeCommentModal = function() {
        var modal = document.getElementById("commentModal");
        modal.classList.remove("active");
        if(commentsUnsubscribe) {
          commentsUnsubscribe();
          commentsUnsubscribe = null;
        }
        document.getElementById("commentModalInput").value = "";
      };
      
      function loadCommentsForModal(postId) {
        var listEl = document.getElementById("commentsList");
        if(commentsUnsubscribe) {
          commentsUnsubscribe();
        }
        // Show loading state
        listEl.innerHTML = '<div class="muted" style="text-align:center; padding: 20px;">Loading comments...</div>';
        commentsUnsubscribe = db.collection("foundation_post_comments")
          .where("postId","==",postId)
          .orderBy("createdAt","desc")
          .onSnapshot(function(snap){
            if(snap.empty){ 
              listEl.innerHTML = '<div class="muted" style="text-align:center; padding: 20px;">No comments yet. Be the first!</div>'; 
              return; 
            }
            listEl.innerHTML = snap.docs.map(function(d){
              var c = d.data();
              var dt = tsToDate(c.createdAt);
              var dateStr = dt ? dt.toLocaleString() : "Just now";
              var initials = (c.userName || "U").charAt(0).toUpperCase();
              var canDelete = (currentUser && (c.userId === currentUser.uid || canPost));
              
              return '<div class="comment-item">'
                + '<div class="comment-avatar">'+ escapeHtml(initials) +'</div>'
                + '<div class="comment-content" style="flex:1;">'
                + '<div style="display:flex; justify-content:space-between; align-items:center;">'
                + '<div class="comment-author">'+ escapeHtml(c.userName||"User") +'</div>'
                + (canDelete ? '<button class="comment-menu-btn" onclick="toggleCommentMenu(\''+d.id+'\')" style="background:none; border:none; cursor:pointer; color:var(--muted); padding:4px;"><i class="fa-solid fa-ellipsis-vertical"></i></button>' : '')
                + '</div>'
                + '<div class="comment-text">'+ escapeHtml(c.commentText||"") +'</div>'
                + '<div class="comment-time">'+ dateStr +'</div>'
                + (canDelete ? '<div id="menu-'+d.id+'" class="comment-menu" style="display:none; margin-top:8px;">'
                + '<button onclick="deleteComment(\''+d.id+'\',\''+postId+'\')" style="background:none; border:none; color:#CE1126; cursor:pointer; padding:4px 0; font-size:12px; display:flex; align-items:center; gap:4px;"><i class="fa-solid fa-trash"></i> Delete</button>'
                + '</div>' : '')
                + '</div>'
                + '</div>';
            }).join("");
          }, function(error) {
            console.error("Error loading comments:", error);
            listEl.innerHTML = '<div style="text-align:center; padding: 20px; color: #CE1126;">Failed to load comments: ' + escapeHtml(error.message) + '</div>';
          });
      }
      
      window.toggleCommentMenu = function(commentId) {
        var menu = document.getElementById('menu-'+commentId);
        if(menu) {
          menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
      };
      
      window.deleteComment = async function(commentId, postId) {
        if(!confirm('Delete this comment?')) return;
        if(!currentUser) return;
        
        try {
          var commentRef = db.collection('foundation_post_comments').doc(commentId);
          var postRef = db.collection('foundation_campaign_posts').doc(postId);
          
          await db.runTransaction(async function(tx) {
            var commentSnap = await tx.get(commentRef);
            if(!commentSnap.exists) return;
            
            tx.delete(commentRef);
            tx.update(postRef, { commentCount: firebase.firestore.FieldValue.increment(-1) });
          });
          
        } catch(e) {
          console.error('Failed to delete comment:', e);
          alert('Failed to delete comment.');
        }
      };
      window.reactPost = async function(postId, type){
        if(!currentUser) return;
        try{
          var rid = postId + '_' + currentUser.uid;
          var rRef = db.collection("foundation_post_reactions").doc(rid);
          var pRef = db.collection("foundation_campaign_posts").doc(postId);
          await db.runTransaction(async function(tx){
            var rSnap = await tx.get(rRef);
            var pSnap = await tx.get(pRef);
            if(!pSnap.exists) return;
            var p = pSnap.data();
            var prev = rSnap.exists ? rSnap.data().reactionType : null;
            if(prev === type) return; // no change
            // adjust counters
            var updates = {};
            function inc(field){ updates[field] = (p[field]||0) + 1; }
            function dec(field){ updates[field] = Math.max(0, (p[field]||0) - 1); }
            if(prev){
              if(prev === "like") dec("likeCount");
              else if(prev === "love") dec("loveCount");
              else if(prev === "wow") dec("wowCount");
              else if(prev === "angry") dec("angryCount");
            }
            if(type === "like") inc("likeCount");
            else if(type === "love") inc("loveCount");
            else if(type === "wow") inc("wowCount");
            else if(type === "angry") inc("angryCount");
            tx.update(pRef, updates);
            tx.set(rRef, { postId: postId, userId: currentUser.uid, reactionType: type }, { merge: true });
          });
        } catch(e){
          alert("Failed to react.");
        }
      };
      window.submitComment = async function(){
        if(!currentUser || !currentPostId) return;
        try{
          var input = document.getElementById("commentModalInput");
          var text = (input.value||"").trim();
          if(!text) return;
          var name = currentUser.displayName || "";
          var pRef = db.collection("foundation_campaign_posts").doc(currentPostId);
          
          // Get foundation data to get owner and admins
          var fdDoc = await db.collection("foundation_requests").doc(fid).get();
          var fdData = fdDoc.exists ? fdDoc.data() : {};
          var ownerId = fdData.ownerId;
          var admins = Array.isArray(fdData.admins) ? fdData.admins : [];
          
          // Add comment
          await db.collection("foundation_post_comments").add({
            postId: currentPostId,
            userId: currentUser.uid,
            userName: name,
            commentText: text,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await pRef.update({ commentCount: firebase.firestore.FieldValue.increment(1) });
          input.value = "";
          
          // Create notifications
          var recipientIds = new Set();
          if(ownerId && ownerId !== currentUser.uid) recipientIds.add(ownerId);
          admins.forEach(function(adminId) {
            if(adminId && adminId !== currentUser.uid) recipientIds.add(adminId);
          });
          
          recipientIds.forEach(function(recipientId) {
            db.collection("notifications").add({
              notificationType: "foundation_comment",
              foundationId: fid,
              foundationName: foundationName,
              postId: currentPostId,
              commenterId: currentUser.uid,
              commenterName: name,
              commentText: text.substring(0, 100), // preview
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              isRead: false,
              recipientId: recipientId
            });
          });
          
        }catch(e){
          console.error("Failed to comment:", e);
          alert("Failed to comment.");
        }
      };
      async function postCampaign(e){
        e.preventDefault();
        if(!canPost){ alert("Only foundation admins can start campaigns."); return; }
        var type = document.getElementById("campaignType").value;
        var file = document.getElementById("campaignImage").files[0];
        var caption = (document.getElementById("campaignCaption").value||"").trim();
        if(!type || !caption){ alert("Please fill all required fields."); return; }
        if(file && file.type && !file.type.startsWith("image/")){ alert("Please select an image file."); return; }
        var btn = document.getElementById("postBtn");
        btn.disabled = true; btn.textContent = "Posting...";
        try{
          var fdDoc = await db.collection("foundation_requests").doc(fid).get();
          var fdName = fdDoc.exists ? (fdDoc.data().name || "Foundation") : "Foundation";
          
          var imageUrl = "";
          if (file) {
            imageUrl = await uploadImage(file);
            if (!imageUrl) {
              throw new Error("Cloudinary upload failed");
            }
          }

          var postRef = db.collection("foundation_campaign_posts").doc();
          await postRef.set({
            postId: postRef.id,
            foundationId: fid,
            foundationName: fdName,
            imageURL: imageUrl,
            caption: caption,
            campaignType: type,
            createdBy: currentUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            likeCount: 0,
            loveCount: 0,
            wowCount: 0,
            angryCount: 0,
            commentCount: 0
          });
          document.getElementById("campaignModal").style.display = "none";
          document.getElementById("campaignForm").reset();
          document.getElementById("previewImg").classList.add("hidden");
          alert("Campaign posted successfully!");
        }catch(e){
          console.error("Campaign post failed:", e);
          alert("Failed to post campaign.");
        } finally {
          btn.disabled = false; btn.textContent = "Post";
        }
      }
    })();
  </script>
</head>
<body>
  <nav class="navbar" style="display:flex; align-items:center; justify-content:space-between;">
    <button id="backBtn" class="logout-btn" style="border:none; background:transparent; padding:0; color:var(--muted);">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>
    <div class="brand" style="text-align:center;">
      <i class="fa-solid fa-droplet"></i>
      <span>BloodConnect</span>
    </div>
    <div>
      <button id="startCampaignBtn" class="action-btn" style="display:none;"><i class="fa-solid fa-bullhorn"></i> Start Campaign</button>
    </div>
  </nav>
  <main class="container">
    <div class="welcome" style="margin-bottom: 10px;">
      <h1 id="pageTitle">Foundation Campaigns</h1>
      <p class="muted">Campaign feed and updates</p>
    </div>
    <section id="campaignFeed">
      <div class="no-results">Loading campaigns...</div>
    </section>
  </main>

  <div id="campaignModal" class="modal">
    <div class="modal-content">
      <h2 style="margin-bottom:10px;">Start Campaign</h2>
      <form id="campaignForm" style="display:grid; gap:12px;">
        <div>
          <label class="label-sm">Campaign Type</label>
          <select id="campaignType" class="select-field" required>
            <option value="">Select Type</option>
            <option>Blood Donation Drive</option>
            <option>Emergency Appeal</option>
            <option>Awareness Campaign</option>
            <option>Volunteer Recruitment</option>
          </select>
        </div>
        <div>
          <label class="label-sm">Upload Image (Optional)</label>
          <input id="campaignImage" type="file" accept="image/*" class="input-field">
          <img id="previewImg" class="preview hidden" alt="preview">
        </div>
        <div>
          <label class="label-sm">Caption (max 500 chars)</label>
          <textarea id="campaignCaption" class="textarea-field" rows="4" maxlength="500" required></textarea>
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" id="closeCampaignModal" class="action-btn secondary">Cancel</button>
          <button id="postBtn" type="submit" class="action-btn"><i class="fa-solid fa-paper-plane"></i> Post</button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Comment Modal -->
  <div id="commentModal" class="comment-modal">
    <div class="comment-modal-content">
      <div class="comment-modal-header">
        <div class="comment-modal-title">Comments</div>
        <button class="comment-modal-close" onclick="closeCommentModal()"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="comment-modal-preview">
        <div class="preview-header">
          <strong id="commentModalPreviewName"></strong>
        </div>
        <div id="commentModalPreviewCaption" class="preview-caption"></div>
        <img id="commentModalPreviewImage" class="preview-image hidden" alt="post preview">
      </div>
      <div id="commentsList" class="comments-list">
        <div class="muted" style="text-align:center; padding: 20px;">Loading comments...</div>
      </div>
      <div class="comment-input-area">
        <input id="commentModalInput" class="comment-input" type="text" maxlength="500" placeholder="Write a comment...">
        <button class="comment-send-btn" onclick="submitComment()">Post</button>
      </div>
    </div>
  </div>
