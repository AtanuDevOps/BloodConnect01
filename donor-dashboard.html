<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Donor Dashboard · BloodConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="" crossorigin="anonymous">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body class="profile-page">
  <div class="profile-header">
    <div class="profile-header-top">
      <h1 class="app-title">BloodConnect</h1>
      <button id="editProfileBtn" class="text-btn top-right">Edit Profile</button>
    </div>
    
    <div class="profile-avatar-container">
      <div id="dashboardAvatar" class="profile-avatar">
        <span id="dashboardAvatarText"></span>
      </div>
      <button id="logoutBtn" class="logout-icon-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
    
    <div class="profile-name-section">
      <h2 id="userName_welcome">Loading...</h2>
      <p class="role-text">Donor</p>
    </div>
  </div>

  <main class="container profile-content">
    <!-- Stats Cards Row -->
    <div class="stats-row">
      <div class="profile-stat-card">
        <i class="fa-solid fa-heart stat-icon"></i>
        <span class="stat-label">Life Saved</span>
        <span id="lifeSavedCount" class="stat-value">--</span>
      </div>
      <div class="profile-stat-card">
        <i class="fa-solid fa-droplet stat-icon"></i>
        <span class="stat-label">Blood Group</span>
        <span id="displayBloodGroup" class="stat-value-large">--</span>
      </div>
      <div id="donationStatusCard" class="profile-stat-card donation-card">
        <span id="nextDonationLabel" class="stat-label-date">Next Donation</span>
        <span id="nextDonationDate" class="stat-value-date">--</span>
      </div>
    </div>

    <!-- Switch Options -->
    <div class="options-list">
      <div class="option-item-switch">
        <span>Available to donate</span>
        <label class="switch">
          <input type="checkbox" id="availableToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="option-item-switch">
        <span>Lock your profile</span>
        <label class="switch">
          <input type="checkbox" id="lockProfileToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <!-- Menu Options -->
    <div class="options-list">
      <div class="option-item" onclick="window.location.href='manage-address.html'">
        <span>Manage Address</span>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
      <div class="option-item" onclick="window.location.href='history.html'">
        <span>History</span>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
      <div class="option-item" id="contactDetailsBtn">
        <span>Contact Details</span>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
    </div>

    <!-- Extra Stats Section -->
    <div class="extra-stats">
      <div class="card stat-card-simple">
        <div class="stat-title"><i class="fa-solid fa-people-group"></i> Total Donors</div>
        <div class="stat-value" id="totalDonorsCount">—</div>
      </div>
      <div class="card stat-card-simple">
        <div class="stat-title"><i class="fa-solid fa-notes-medical"></i> Active Blood Requests</div>
        <div class="stat-value" id="activeRequestsCount">—</div>
      </div>
    </div>

    <!-- Contact Details Section (Initially hidden) -->
    <div id="contactDetailsSection" class="card" style="display:none; margin-top:16px;">
      <h3 style="margin-bottom:12px;">Contact Details</h3>
      <div style="display:grid; gap:8px; font-size:14px;">
        <div><i class="fa-solid fa-location-dot" style="color:var(--primary); width:20px"></i> <strong>Location:</strong> <span id="displayLocation">Not set</span></div>
        <div><i class="fa-solid fa-phone" style="color:var(--primary); width:20px"></i> <strong>Phone:</strong> <span id="displayPhone">Not set</span></div>
      </div>
    </div>

    <!-- My Blood Requests (As Requestor) - Hidden by default, can be seen in History -->
    <section class="card" id="myRequestsSection" style="display:none; margin-top:16px;">
      <h3 style="margin-bottom:12px;">My Blood Requests</h3>
      <div id="myRequestsList" style="display:grid; gap:10px;"></div>
    </section>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
      <div class="card" style="width:90%; max-width:400px; padding:24px;">
        <h2 style="margin-bottom:16px">Edit Profile</h2>
        <form id="editProfileForm" style="display:grid; gap:16px;">
          <div>
            <label for="fullName" style="font-size:12px; color:var(--muted)">Full Name</label>
            <input id="fullName" type="text" placeholder="Enter your name" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;" required>
          </div>
          <div>
            <label for="phoneNumber" style="font-size:12px; color:var(--muted)">Phone Number</label>
            <input id="phoneNumber" type="text" placeholder="e.g. 017xxxxxxxx" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
          </div>
          <div>
            <label for="bloodGroup" style="font-size:12px; color:var(--muted)">Blood Group</label>
            <select id="bloodGroup" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;" required>
              <option value="">Select Blood Group</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
          <div>
            <label for="location" style="font-size:12px; color:var(--muted)">Location (City/Area)</label>
            <input id="location" type="text" placeholder="e.g. Dhaka, Mirpur" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
          </div>
          <div>
            <label for="editProfileColor" style="font-size:12px; color:var(--muted)">Avatar Background Color</label>
            <div class="color-presets">
              <div class="color-option color-red" data-color="#CE1126"></div>
              <div class="color-option color-blue" data-color="#2563eb"></div>
              <div class="color-option color-green" data-color="#10b981"></div>
              <div class="color-option color-purple" data-color="#8b5cf6"></div>
              <div class="color-option color-orange" data-color="#f59e0b"></div>
            </div>
            <input type="hidden" id="editProfileColor" value="#CE1126">
          </div>
          <div>
            <label for="profileImageInput" style="font-size:12px; color:var(--muted)">Profile Picture</label>
            <input id="profileImageInput" type="file" accept="image/*" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:12px;">
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;">
            <button type="button" id="cancelEditBtn" class="action-btn secondary" style="padding:10px;">Cancel</button>
            <button type="button" id="saveProfileBtn" class="action-btn" style="padding:10px;">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./cloudinary-config.js"></script>
  <script src="./dashboard.js"></script>
  <script>
    // Inline script for Donor Dashboard extra sections
    (function(){
      const db = firebase.firestore();
      const auth = firebase.auth();
      auth.onAuthStateChanged(user => {
        if(user) {
          loadMyRequests(user.uid);
          loadMyResponses(user.uid);
        }
      });
      
      // 1. My Requests
      async function loadMyRequests(uid) {
        try {
          const snap = await db.collection("bloodRequests").where("createdBy", "==", uid).orderBy("createdAt", "desc").limit(3).get();
          if(!snap.empty) {
            document.getElementById("myRequestsSection").style.display = "block";
            document.getElementById("myRequestsList").innerHTML = snap.docs.map(doc => {
              const d = doc.data();
              const rCount = d.responses ? d.responses.length : 0;
              return `
                <div style="padding:10px; background:var(--bg); border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-weight:600; font-size:14px;">${d.patientName} (${d.bloodGroup})</div>
                    <div style="font-size:12px; color:var(--muted)">${d.hospitalName}</div>
                  </div>
                  <div style="font-size:12px; font-weight:600; color:${rCount>0?'var(--primary)':'var(--muted)'}">
                    ${rCount} Resp.
                  </div>
                </div>
              `;
            }).join("");
          }
        } catch(e) { console.error("Error loading my requests", e); }
      }

      // 2. Responses Given (Logic: Find requests where responses array contains my uid)
      // Note: Firestore array-contains doesn't work easily on object arrays. 
      // Workaround: We fetch all requests (or recent ones) and filter client side, OR we rely on a separate collection "responses".
      // Given constraints "Use Firestore only", "No backend", "Avoid over-engineering", and structure given:
      // "responses: [{ donorId: ... }]"
      // Firestore query cannot search inside array of objects for specific field value easily without index or simple array.
      // Optimally, we would have stored "responderIds" array in the doc for querying.
      // For now, I'll skip complex query and just leave it as a placeholder or fetch recent 50 global requests and filter.
      // Fetching all might be heavy. Let's try to be smart: 
      // Actually, since I can't change structure easily (already defined in prompt), I will just fetch latest 20 requests and filter.
      
      async function loadMyResponses(uid) {
        try {
          // Limitation: Only checks recent 50 requests
          const snap = await db.collection("bloodRequests").orderBy("createdAt", "desc").limit(50).get();
          const myResponses = [];
          snap.forEach(doc => {
            const data = doc.data();
            if(data.responses && data.responses.some(r => r.donorId === uid)) {
              myResponses.push(data);
            }
          });

          if(myResponses.length > 0) {
            document.getElementById("myResponsesSection").style.display = "block";
            document.getElementById("myResponsesList").innerHTML = myResponses.slice(0, 5).map(d => {
              return `
                <div style="padding:10px; background:var(--bg); border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-weight:600; font-size:14px;">Helping: ${d.patientName}</div>
                    <div style="font-size:12px; color:var(--muted)">${d.hospitalName}</div>
                  </div>
                  <div style="font-size:12px; color:green;">
                    <i class="fa-solid fa-check"></i> Responded
                  </div>
                </div>
              `;
            }).join("");
          }
        } catch(e) { console.error("Error loading my responses", e); }
      }
    })();
  </script>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="blood-requests.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
    </a>
    <a href="find-donors.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>
    <a href="foundation.html" class="nav-item">
      <i class="fa-solid fa-users"></i>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-message"></i>
    </a>
    <a href="notifications.html" class="nav-item">
      <i class="fa-solid fa-bell"></i>
    </a>
    <a href="donor-dashboard.html" class="nav-item active">
      <i class="fa-solid fa-user"></i>
    </a>
  </nav>
</body>
</html>
