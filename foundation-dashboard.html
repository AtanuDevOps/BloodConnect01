<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foundation Profile · BloodConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./dashboard.css">
  <link rel="stylesheet" href="./foundation-profile.css">
  <style>
    .hidden { display:none; }
    /* Comment Modal Styles */
    .comment-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      animation: fadeIn 0.2s ease-out;
    }
    .comment-modal.active { display: flex; align-items: flex-end; justify-content: center; }
    .comment-modal-content {
      width: 100%;
      max-height: 85vh;
      background: #fff;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }
    @media (min-width: 768px) {
      .comment-modal.active { align-items: center; }
      .comment-modal-content {
        max-width: 560px;
        max-height: 80vh;
        border-radius: 16px;
      }
    }
    .comment-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .comment-modal-title { font-weight: 600; font-size: 16px; }
    .comment-modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
      padding: 4px;
    }
    .comment-modal-preview { padding: 12px 16px; border-bottom: 1px solid #e0e0e0; }
    .comment-modal-preview .preview-header { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .comment-modal-preview .preview-caption { font-size: 14px; color: #333; }
    .comment-modal-preview .preview-image { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .comment-item {
      display: flex;
      gap: 10px;
      font-size: 14px;
    }
    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #CE1126, #ff6b6b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .comment-content { flex: 1; }
    .comment-author { font-weight: 600; margin-bottom: 2px; }
    .comment-text { color: #444; }
    .comment-time { font-size: 11px; color: #888; margin-top: 4px; }
    .comment-input-area {
      padding: 12px 16px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .comment-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
    }
    .comment-input:focus { border-color: #CE1126; }
    .comment-send-btn {
      background: #CE1126;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }
    .comment-send-btn:hover { background: #a80f20; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./cloudinary-config.js"></script>
</head>
<body class="foundation-profile-page">
  <!-- Hidden File Inputs -->
  <input type="file" id="coverUpload" accept="image/*" style="display:none;">
  <input type="file" id="profileUpload" accept="image/*" style="display:none;">

  <div class="foundation-header">
    <div class="cover-container">
      <img id="coverImg" src="https://via.placeholder.com/1200x400?text=Foundation+Cover" class="cover-image" alt="Cover">
      <button id="editCoverBtn" class="edit-cover-btn" style="display:none;">
        <i class="fa-solid fa-camera"></i> Edit Cover
      </button>
    </div>
    <div class="profile-img-container">
      <img id="profileImg" src="https://via.placeholder.com/150?text=F" class="profile-image" alt="Profile">
      <div id="editProfileImgBtn" class="edit-profile-img-btn" style="display:none;">
        <i class="fa-solid fa-camera"></i>
      </div>
    </div>
    <div class="foundation-name-section">
      <h1 id="foundationName">Loading...</h1>
      <p id="foundationLocation" class="muted" style="font-size:14px; margin-top:4px;">Location Loading...</p>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-item-card">
      <i class="fa-solid fa-users"></i>
      <span id="membersCount" class="stat-item-value">0</span>
      <span class="stat-item-label">Foundation Members</span>
    </div>
    <div class="stat-item-card">
      <i class="fa-solid fa-phone"></i>
      <span class="stat-item-value">Contact</span>
      <span class="stat-item-label">Contact Info</span>
    </div>
    <div class="stat-item-card">
      <i class="fa-solid fa-hand-holding-droplet"></i>
      <span id="availableDonorsCount" class="stat-item-value">0</span>
      <span class="stat-item-label">Available Donors</span>
    </div>
  </div>

  <div id="adminPostSection" class="create-post-section" style="display:none;">
    <div id="adminAvatar" class="create-post-avatar">F</div>
    <div id="postTrigger" class="create-post-trigger">What's on your mind?</div>
  </div>

  <div class="info-cards-container">
    <div class="info-small-card">
      <div class="label">LIFE SAVED</div>
      <div id="totalLivesSaved" class="value">0</div>
    </div>
    <div class="info-small-card">
      <div class="label">BLOOD GROUPS</div>
      <div class="blood-group-list">
        <span class="blood-mini-tag">A+</span><span class="blood-mini-tag">B+</span>
        <span class="blood-mini-tag">O+</span><span class="blood-mini-tag">AB+</span>
        <span class="blood-mini-tag">A-</span><span class="blood-mini-tag">B-</span>
        <span class="blood-mini-tag">O-</span><span class="blood-mini-tag">AB-</span>
      </div>
    </div>
    <div class="info-small-card">
      <div class="label">TOP 10</div>
      <div class="value">#—</div>
    </div>
  </div>

  <div class="foundation-actions-grid">
    <div id="manageBtn" class="action-icon-btn">
      <i class="fa-solid fa-gear"></i>
      <span>Manage</span>
    </div>
    <div id="chatBtn" class="action-icon-btn">
      <i class="fa-solid fa-message"></i>
      <span>Chat</span>
    </div>
    <div id="historyBtn" class="action-icon-btn">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>History</span>
    </div>
    <div id="leaveBtn" class="action-icon-btn">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Leave</span>
    </div>
  </div>

  <!-- Foundation Join Requests Section -->
  <section class="card" id="foundationJoinRequestsSection" style="display:none; margin:16px; margin-bottom: 0;">
    <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-users-line"></i> Pending Join Requests</h3>
    <div id="foundationJoinRequestsList" style="display: grid; gap: 12px;"></div>
  </section>

  <!-- Campaign Feed Container -->
  <div id="campaignFeed" style="padding:0 16px 110px;">
    <!-- Posts will be injected here -->
  </div>

  <!-- Campaign Creation Modal (Simplified) -->
  <div id="campaignModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Create Campaign</h3>
      <form id="campaignForm">
        <select id="campaignType" class="input-field" required>
          <option value="">Campaign Type</option>
          <option value="Urgent">Urgent</option>
          <option value="Event">Event</option>
          <option value="Awareness">Awareness</option>
        </select>
        <textarea id="campaignCaption" class="input-field" placeholder="Campaign description..." rows="3" required></textarea>
        <input id="campaignImage" type="file" accept="image/*" class="input-field">
        <div style="display:flex; gap:12px; margin-top:12px;">
          <button type="button" id="closeModal" class="action-btn secondary" style="flex:1">Cancel</button>
          <button type="submit" id="postBtn" class="action-btn" style="flex:1">Post</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Comment Modal -->
  <div id="commentModal" class="comment-modal">
    <div class="comment-modal-content">
      <div class="comment-modal-header">
        <div class="comment-modal-title">Comments</div>
        <button class="comment-modal-close" onclick="closeCommentModal()"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="comment-modal-preview">
        <div class="preview-header">
          <strong id="commentModalPreviewName"></strong>
        </div>
        <div id="commentModalPreviewCaption" class="preview-caption"></div>
        <img id="commentModalPreviewImage" class="preview-image hidden" alt="post preview">
      </div>
      <div id="commentsList" class="comments-list">
        <div style="text-align:center; padding: 20px; color: #888;">Loading comments...</div>
      </div>
      <div class="comment-input-area">
        <input id="commentModalInput" class="comment-input" type="text" maxlength="500" placeholder="Write a comment...">
        <button class="comment-send-btn" onclick="submitComment()">Post</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="blood-requests.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
    </a>
    <a href="find-donors.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>
    <a href="foundation.html" class="nav-item active">
      <i class="fa-solid fa-users"></i>
    </a>
    <a href="foundation-chat.html" class="nav-item">
      <i class="fa-solid fa-message"></i>
    </a>
    <a href="notifications.html" class="nav-item" style="position:relative;">
      <i class="fa-solid fa-bell"></i>
      <span id="unreadCount" class="unread-badge" style="display:none; position:absolute; top:2px; right:2px; background:#CE1126; color:#fff; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;"></span>
    </a>
    <a href="donor-dashboard.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
    </a>
  </nav>

  <script src="./js/foundation-profile.js"></script>
</body>
</html>
